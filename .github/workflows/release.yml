name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - custom_components/signal_lights/manifest.json

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract tag version
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            version=$(python3 -c "import json; print(json.load(open('custom_components/signal_lights/manifest.json'))['version'])")
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Check manifest.json version
        run: |
          manifest_version=$(python3 -c "import json; print(json.load(open('custom_components/signal_lights/manifest.json'))['version'])")
          if [ "$manifest_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.tag.outputs.version }}) != manifest.json ($manifest_version)"
            exit 1
          fi

      - name: Check pyproject.toml version
        run: |
          pyproject_version=$(python3 -c "
          import re
          text = open('pyproject.toml').read()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', text, re.MULTILINE)
          print(m.group(1))
          ")
          if [ "$pyproject_version" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.tag.outputs.version }}) != pyproject.toml ($pyproject_version)"
            exit 1
          fi

  lint:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check
      - run: mypy custom_components/signal_lights/ tests/

  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest --tb=short -q

  release:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/signal_lights/manifest.json'))['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "Signal Lights $tag"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
